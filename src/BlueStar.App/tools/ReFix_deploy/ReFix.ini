; =============================================================================
; ReFix Universal Network Arbitration Engine (UNAE) Configuration
; =============================================================================

[Game]
GameName = 
EngineType = 

[Network]
; Modo global de arbitraje:
;   auto         - Deteccion automatica de capacidades, topologia y cascada inteligente (Recomendado).
;   force_p2p    - Fuerza transporte P2P directo (Tier 1 LAN / Tier 2 SDR). Falla si el juego requiere cloud relay.
;   force_relay  - Salta P2P directo y enruta inmediatamente a traves de nubes de relevo (EOS / Photon).
;   force_lan    - Aisla la conectividad a la subred local (Tier 1 exclusivo, sin salidas a Internet).
;   offline      - Desactiva toda actividad de red externa; emulacion local absoluta.
Mode = auto

; Puerto base de escucha y descubrimiento UDP para Re:Goldberg y UNAE LAN (Default: 47584)
DiscoveryPort = 47584

; Grupo de multidifusion IPv4 para descubrimiento sin configuracion en la misma subred
DiscoveryGroup = 239.255.71.84

; Tiempo de espera de respuesta de hosts locales en LAN antes de evaluar WAN (milisegundos)
LanProbeTimeoutMs = 2500

; IPs de difusion adicionales para VPNs (Radmin, Hamachi, ZeroTier) separadas por comas
CustomBroadcasts = 

; Registro detallado del motor de arbitraje en ReFix.log
VerboseArbitrationLog = true


; =============================================================================
; Direct P2P & Valve Steam Datagram Relay (SDR) Tunneling
; =============================================================================
[P2P]
; Habilita los hooks de intercepcion sobre ws2_32.dll (sendto, recvfrom, connect, select, bind)
EnableWinsockHooks = true

; Enruta paquetes UDP de juegos a traves del tunel SDR moderno de Valve (ISteamNetworkingMessages / AppID 480 Spacewar)
EnableSteamSDR = true
Transport = sdr

; Permite la retransmision por servidores mundiales de Valve si no hay conexion P2P directa
AllowRelay = true

; Sincronizacion automatica de salas y miembros via SteamMatchmaking (Spacewar 480)
AutoSyncLobbyPeers = true

; Subred virtual para peers P2P (Default: 10.48.0.0/16)
VirtualSubnet = 10.48.0.0

; Puerto UDP principal de la sesion de juego (Default: 7777 para Unreal/Mirror/REPO, 27015 para Fusion, 7770 para Party Animals)
P2PPort = 7777

; Preserva trafico local loopback (127.0.0.0/8) para IPC interno sin desvio a peers P2P (Default: true)
PreserveLoopback = true

; Tiempo de espera de negociacion de sesion P2P antes de activar fallback (milisegundos)
PeerHandshakeTimeoutMs = 5000

; Maximo porcentaje de perdida de paquetes tolerable antes de transicionar de Tier (Default: 40)
MaxPacketLossTolerance = 40

; Fuerza fallo rapido en conexiones salientes a nubes oficiales (puertos 443/80) para evitar bloqueos TCP (16s freeze).
; Solo para modos offline/LAN: en modo online bloquea los backends oficiales (EOS, PlayFab, APIs web).
FastCloudFail = false

; Servidor HTTP local en loopback para el backend de un juego concreto (solo Party Animals por ahora).
LocalBackend = false

; Activa integracion generica IL2CPP para enrutar el juego a la red P2P y transicionar al menu principal
EnableIL2CPPBridge = true

; Modo de juego sin login (Party Animals): tras cargar los DLLs hot-update se cambia
; StaticGameInfoAot.modeType para que TrailBlazer complete el login sin backend y el juego
; cargue el salon de NemoLand por su flujo normal.
;   p2p     - ModeType.P2P: sin login; las peticiones al backend van al backend local (por defecto)
;   lan     - ModeType.Lan: sin login; el juego bloquea toda peticion al backend
;   unknown - ModeType.Unknown
;   off     - Desactivado (usa la transicion sintetica de ReFix)
OfflineModeType = p2p

; Backend local: servidor HTTP en 127.0.0.1 que responde las peticiones (Lambda) del juego.
; Se redirigen las URLs cuyo host contiene LocalBackendHost.
LocalBackend = true
LocalBackendHost = partyanimalsgame.com

; Id de cuenta/perfil local en modo sin login (vacio = fake_<SteamID64>). Debe ser estable para que el
; perfil local (tutorial, ajustes) persista entre sesiones y unico por jugador para la red P2P.
OfflineProfileId =

; Copia el log interno del juego (RecreateLogger, normalmente cifrado en *.logx) a ReFix.log
ForwardGameLog = false


; =============================================================================
; Photon Ecosystem & Cloud Relay Configuration (PUN 2, Realtime & Fusion)
; =============================================================================
[Photon]
; Proveedor de backend para el ecosistema Photon:
;   ReFixP2P        - Emulador local de Photon + Steam P2P (Spacewar 480). Sin servidores de terceros.
;   ReFixCloud      - Infraestructura gestionada/local ReFix (Cero costo, alto rendimiento).
;   OfficialPhoton  - Conexion a la nube publica de Photon Engine (Requiere AppIDs validos).
;   CustomPhoton    - Servidores privados self-hosted (Photon Server / Luxon).
Backend = ReFixP2P

; ReFixP2P: sufijos de host de Photon Cloud que se resuelven al emulador local (separados por ';')
HostSuffixes = photonengine.io;photonengine.com;exitgames.com

; ReFixP2P: canal de ISteamNetworkingMessages usado para el trafico Photon entre jugadores
SteamChannel = 9

; Clave de Aplicacion desacoplada para Photon Realtime y PUN 2 (Sincronizacion de juego y salas)
AppIdRealtime = 

; Clave de Aplicacion desacoplada para Photon Fusion (Tick simulation / Prediccion de estado)
AppIdFusion = 

; Gestion de Regiones:
;   dynamic - Preserva fielmente la region seleccionada por el usuario en la UI del juego (Recomendado).
;   auto    - Realiza sondeo de ping y conecta automaticamente a la region de menor latencia.
;   fixed   - Fuerza estaticamente la region definida en DefaultRegion, bloqueando la UI del juego.
RegionMode = dynamic

; Region por defecto o de contingencia (sa, us, usw, use, eu, asia, jp, ru)
DefaultRegion = sa

; Preserva la seleccion de region del jugador en interfaces como Phasmophobia y R.E.P.O.
PreserveGameUiRegion = true


; =============================================================================
; Positional Audio & Voice Communications Subsystem
; =============================================================================
[Voice]
; Backend de transmision de voz:
;   PhotonVoice - Utiliza el canal desacoplado Photon Voice 2 (Opus 24-48kHz).
;   EOSRTC      - Utiliza las salas de voz WebRTC de Epic Online Services.
;   SteamVoice  - Utiliza la API ISteamUser::GetVoice de Steamworks.
;   Disabled    - Desactiva el subsistema de comunicaciones por voz.
Backend = PhotonVoice

; Clave de Aplicacion desacoplada exclusiva para Photon Voice 2
; NOTA CRITICA: No reutilizar la misma clave de AppIdRealtime para evitar agotar el limite de CCU.
AppIdVoice = 

; Tasa de muestreo de audio / Bitrate de voz (en bps, Default: 32000)
Bitrate = 32000

; Activa la intercepcion de atenuacion espacial 3D segun la distancia entre avatares
EnableProximityVoice = true


; =============================================================================
; Emulated Steam Subsystems & User Identity
; =============================================================================
[Online]
Mode = valve

[Steam]
MaskAppId = 480
RealAppId = 1260320
Language = english
BypassLicenseCheck = true
AppendCommandLine = -steam -pa -en PartyAnimals
DLCs = 

[User]
Name = Player
AutoGenerateSteamId = true
SteamId = 

[Matchmaking]
EnableLobbyFilter = false
LobbyFilterKey = game_filter
LobbyFilterValue = 480
LobbyDistanceFilter = worldwide
MaxLobbyResults = 50

[ServerBrowser]
OverrideServerListAppId = false
ServerListAppId = 480

[Storage]
LocalSave = saves

[EOS]
Mode = passthrough
DeviceIdAuth = true

[Debug]
EnableLog = true
EnableConsole = false

[HTTP]
; Opt-in per game: ReFix fetches and answers Steam HTTP requests (e.g. init codes, server manifests).
; Leave off unless the game needs it; it must never be on for games that use Steam HTTP normally.
EnableProxy = false
; Response served for init_code requests when EnableProxy is on (game-specific)
InitCodeOverride =

; =============================================================================
; Local Offline Inventory Persistence
; =============================================================================
[Inventory]
; Opt-in offline inventory persistence through ISteamInventory emulation (V003). Purchases are never emulated.
EnableLocalInventory = false
; JSON file storing unlocked cosmetic items, quantities, and flags
InventoryFile = ReFix_Inventory.json
; Default quantity granted when generating or purchasing new items
DefaultQuantity = 1
