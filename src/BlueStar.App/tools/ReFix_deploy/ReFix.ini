; ReFix Universal Network Arbitration Engine (UNAE) Configuration

[Game]
GameName = 
EngineType = 

[Network]
; Global arbitration mode: auto (recommended), force_p2p, force_relay, force_lan, offline
Mode = auto

; ReFix LAN: allow (default) lets the game reach its own Internet services; block = local network only
InternetAccess = allow

; Discovery and listen UDP port for LAN peers (default: 47584)
DiscoveryPort = 47584

; IPv4 multicast group for zero-config local subnet discovery
DiscoveryGroup = 239.255.71.84

; Local LAN probe timeout before evaluating WAN fallback (ms)
LanProbeTimeoutMs = 2500

; Additional broadcast IPs for virtual private networks (comma-separated)
CustomBroadcasts = 

; Verbose arbitration engine diagnostics in ReFix.log
VerboseArbitrationLog = true

[P2P]
; Intercept socket operations (sendto, recvfrom, connect, select, bind)
EnableWinsockHooks = true

; Tunnel game UDP traffic via Steam Datagram Relay (SDR)
EnableSteamSDR = true
Transport = sdr

; Allow Valve relay cluster fallback when direct peer connection is unavailable
AllowRelay = true

; Synchronize lobby peers automatically via Steam matchmaking
AutoSyncLobbyPeers = true

; Virtual subnet assigned to P2P peers
VirtualSubnet = 10.48.0.0

; Primary game session UDP port (default: 7777)
P2PPort = 7777

; Preserve 127.0.0.1 loopback traffic for local IPC without redirection
PreserveLoopback = true

; P2P session negotiation handshake timeout (ms)
PeerHandshakeTimeoutMs = 5000

; Maximum packet loss percentage before transitioning network tiers (default: 40)
MaxPacketLossTolerance = 40

; Immediately fail outgoing cloud connections (ports 80/443) in offline modes to prevent TCP stalls
FastCloudFail = false

; Loopback HTTP service for titles requiring emulated web APIs: auto, true, false
LocalBackend = auto
LocalBackendHost = 

; Generic IL2CPP integration bridge
EnableIL2CPPBridge = true

; Offline authentication mode for compatible IL2CPP titles: auto, p2p, lan, off
OfflineModeType = auto

; Persistent local profile ID (empty = auto-derived from SteamID)
OfflineProfileId = 

; Mirror internal engine logs to ReFix.log
ForwardGameLog = false

[Photon]
; Backend provider: ReFixP2P (local emulator over Steam P2P), ReFixCloud, OfficialPhoton, CustomPhoton
Backend = ReFixP2P

; Host suffixes resolved to the local emulator (semicolon-separated)
HostSuffixes = photonengine.io;photonengine.com;exitgames.com

; Steam networking channel used for Photon peer traffic
SteamChannel = 9

; Custom Application ID for Photon Realtime and PUN 2
AppIdRealtime = 

; Custom Application ID for Photon Fusion
AppIdFusion = 

; Region management: dynamic (preserves game UI selection), auto (lowest ping), fixed (DefaultRegion)
RegionMode = dynamic

; Fallback or fixed region code (sa, us, usw, use, eu, asia, jp, ru)
DefaultRegion = sa

; Preserve user-selected region in game UI
PreserveGameUiRegion = true

; Strip region prefixes ('eu#', 'us#') from room codes for cross-region matchmaking
NormalizeRoomTokens = true

; Safe loader mode for games with module integrity checks
SafeLoaderMode = true

; Force anonymous authentication in memory for offline/LAN play
ForceAnonymous = true

; Bypass Steam authentication ticket acquisition in memory
BypassTicket = true

[Fusion]
; Force Host/Client topology instead of Shared Mode (Host=4 for room creator, Client=5 for peers)
; Default false: preserves native game mode (e.g. local Shared Mode emulation)
ForceHost = false

[Voice]
; Voice transmission backend: PhotonVoice, EOSRTC, SteamVoice, Disabled
Backend = PhotonVoice

; Application ID for Photon Voice 2 (keep separate from AppIdRealtime)
AppIdVoice = 

; Audio bitrate in bps (default: 32000)
Bitrate = 32000

; Enable 3D positional audio attenuation based on avatar distance
EnableProximityVoice = true

[Online]
Mode = valve

[Steam]
; Steam online services in ReFix LAN (play with Steam friends over Steam P2P as Spacewar):
;   auto (default) = on when Steam is already open and signed in; on = opens Steam if needed; off = never.
; The switch in the overlay (Shift+Tab) overrides this for the player.
OnlineServices = auto
MaskAppId = 730
RealAppId = 730
Language = english
BypassLicenseCheck = true
AppendCommandLine = 
DLCs = 

[User]
; IdentityMode: auto (SteamID derived from MachineGuid + instance slot), fixed (uses SteamId below)
IdentityMode = auto
Name = Player
AutoGenerateSteamId = true
SteamId = 

[Overlay]
; Enabled: ReFix overlay (Shift+Tab / gamepad guide button) for profiles, LAN peers, and invites
Enabled = true
; Block Steam's native overlay from rendering
BlockSteamOverlay = true
; Audio feedback for overlay navigation and notifications
Sounds = true
; Isolate Cloud storage and save directories per profile
IsolateSaves = true
; Show profile creation dialog on first launch (false boots directly into game)
FirstRunDialog = false

[Matchmaking]
EnableLobbyFilter = false
LobbyFilterKey = game_filter
LobbyFilterValue = 730
LobbyDistanceFilter = worldwide
MaxLobbyResults = 50

[ServerBrowser]
; Server list of the game (dedicated / community servers). true: searched under ServerListAppId (the game's real
; AppID), so its public servers show up; AutoDeploy sets this when it knows the real AppID. false: searched as the
; masked AppID (Spacewar 480), where servers hosted with ReFix Online register.
OverrideServerListAppId = false
ServerListAppId = 480

[Storage]
LocalSave = saves

[EOS]
Mode = passthrough
DeviceIdAuth = true

[Debug]
EnableLog = false
EnableConsole = false
GCTrace = 1

[HTTP]
; Intercept and answer Steam HTTP requests locally
EnableProxy = false
; Custom response payload for init_code requests
InitCodeOverride = 

[Inventory]
; Offline inventory persistence via ISteamInventory emulation
EnableLocalInventory = false
; JSON file storing unlocked items and attributes
InventoryFile = ReFix_Inventory.json
; Default quantity granted for item definitions
DefaultQuantity = 1


[Mods]
Enabled = true
DevMode = true
