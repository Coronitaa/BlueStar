name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BlueStar.sln

      - name: Build solution
        run: dotnet build BlueStar.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test BlueStar.sln -c Release --no-build --verbosity normal

      - name: Publish WPF App
        run: dotnet publish src/BlueStar.App/BlueStar.App.csproj -c Release -r win-x64 --self-contained false -o src/BlueStar.App/bin/Release/net8.0-windows/publish

      - name: Compile Inno Setup Installer
        uses: MinCiencia/action-innosetup@v1
        with:
          path: installer/BlueStar.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueStar-Setup
          path: installer/Output/BlueStar-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/BlueStar-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
