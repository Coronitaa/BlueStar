name: Client CI

on:
  push:
    branches:
      - main
      - feat/manifest-hub-integration
  pull_request:
    branches:
      - main
      - feat/manifest-hub-integration

jobs:
  test:
    name: Build & Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore tests/BlueStar.Core.Tests/BlueStar.Core.Tests.csproj
          dotnet restore tests/BlueStar.Infrastructure.Tests/BlueStar.Infrastructure.Tests.csproj
          dotnet restore tests/BlueStar.App.Tests/BlueStar.App.Tests.csproj

      - name: Build Tests
        run: |
          dotnet build tests/BlueStar.Core.Tests/BlueStar.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/BlueStar.Infrastructure.Tests/BlueStar.Infrastructure.Tests.csproj -c Release --no-restore
          dotnet build tests/BlueStar.App.Tests/BlueStar.App.Tests.csproj -c Release --no-restore

      - name: Run Core Tests
        run: dotnet test tests/BlueStar.Core.Tests/BlueStar.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Infrastructure Tests
        run: dotnet test tests/BlueStar.Infrastructure.Tests/BlueStar.Infrastructure.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run App Tests
        run: dotnet test tests/BlueStar.App.Tests/BlueStar.App.Tests.csproj -c Release --no-build --verbosity normal
