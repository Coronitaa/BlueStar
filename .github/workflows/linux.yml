name: Linux

on:
  workflow_dispatch:
  push:
    branches: [feat/linux-support]

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: Core + Infrastructure tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # BlueStar.App.Tests is WPF (net10.0-windows) and stays Windows-only.
      - name: Core tests
        run: dotnet test tests/BlueStar.Core.Tests -c Release --filter "OS!=Windows&Requires!=LocalSecrets" --logger "trx;LogFileName=core.trx" --results-directory test-results

      - name: Infrastructure tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/BlueStar.Infrastructure.Tests -c Release --filter "OS!=Windows&Requires!=LocalSecrets" --logger "trx;LogFileName=infra.trx" --results-directory test-results

      # Already part of the run above; repeated with detailed output so the heap numbers show in the log.
      - name: Memory tests (heap growth report)
        if: ${{ !cancelled() }}
        shell: bash # -eo pipefail: a failing test must fail the step despite the grep
        run: dotnet test tests/BlueStar.Infrastructure.Tests -c Release --no-build --filter "Category=Memory" --logger "console;verbosity=detailed" | grep -E "\[memory\]|Passed|Failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results

  scripts:
    name: ReFix shell scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck bats

      # Errors block; warnings are reported only, the script is ReFix's own and updates overwrite it.
      - name: shellcheck
        run: |
          shellcheck -S warning src/BlueStar.App/tools/ReFix_deploy/*.sh || true
          shellcheck -S error src/BlueStar.App/tools/ReFix_deploy/*.sh

      - name: bats
        run: bats tests/scripts

  avalonia-spike:
    name: Avalonia 12 WebView spike (xvfb)
    runs-on: ubuntu-latest
    # Known result (Avalonia.Controls.WebView 12.1.2): script + navigation cancel pass on WebKitGTK 4.1, the cookie
    # manager is missing (its GTK adapter calls the WebKitGTK 6.0-only network-session API). Reported, not blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebKitGTK and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth dbus-x11

      - name: Publish linux-x64 self-contained
        run: dotnet publish spikes/AvaloniaSpike -c Release -r linux-x64 --self-contained true -o out/spike

      - name: Run self-test
        run: dbus-run-session -- xvfb-run -a timeout 120 ./out/spike/AvaloniaSpike --selftest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-spike-linux-x64
          path: out/spike

  linux-app:
    name: Linux app (build, package, run a game under Proton)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 xvfb xauth dbus-x11 desktop-file-utils

      # Keys are optional: without these secrets the build simply ships without bundled API keys.
      - name: Build tar.gz + AppImage
        env:
          BLUESTAR_DEPOTBOX_API_KEY: ${{ secrets.BLUESTAR_DEPOTBOX_API_KEY }}
          BLUESTAR_MODKEYS_JSON: ${{ secrets.BLUESTAR_MODKEYS_JSON }}
        run: bash packaging/linux/build-linux.sh

      - name: Headless --launch rejects a bad id
        run: |
          set +e
          HOME="$(mktemp -d)" dist/linux/BlueStar.AppDir/usr/lib/bluestar/BlueStar --launch not-a-guid
          test $? -eq 2

      - name: AppImage starts (self-test, no game)
        run: HOME="$(mktemp -d)" APPIMAGE_EXTRACT_AND_RUN=1 dbus-run-session -- xvfb-run -a timeout 180 dist/linux/BlueStar-*.AppImage --selftest

      - name: Build the test game (Windows .exe)
        run: |
          mkdir -p "$RUNNER_TEMP/game"
          x86_64-w64-mingw32-gcc -O2 -o "$RUNNER_TEMP/game/SelfTestGame.exe" tests/linux/selftest-game.c

      - name: Install umu-launcher (zipapp) and allow user namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Open-Wine-Components/umu-launcher --pattern '*zipapp.tar' --dir "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP"/*zipapp.tar -C "$RUNNER_TEMP"
          echo "$(dirname "$(find "$RUNNER_TEMP" -name umu-run -type f | head -1)")" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run a Windows game through BlueStar + umu + Proton
        run: HOME="$(mktemp -d)" dbus-run-session -- xvfb-run -a timeout 1800 dist/linux/BlueStar.AppDir/usr/lib/bluestar/BlueStar --selftest "$RUNNER_TEMP/game/SelfTestGame.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bluestar-linux-x64
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.AppImage
            dist/linux/SHA256SUMS
