name: Linux

on:
  workflow_dispatch:
  push:
    branches: [feat/linux-support]

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: Core + Infrastructure tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # BlueStar.App.Tests is WPF (net10.0-windows) and stays Windows-only.
      - name: Core tests
        run: dotnet test tests/BlueStar.Core.Tests -c Release --filter "OS!=Windows&Requires!=LocalSecrets" --logger "trx;LogFileName=core.trx" --results-directory test-results

      - name: Infrastructure tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/BlueStar.Infrastructure.Tests -c Release --filter "OS!=Windows&Requires!=LocalSecrets" --logger "trx;LogFileName=infra.trx" --results-directory test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results

  avalonia-spike:
    name: Avalonia 12 WebView spike (xvfb, ${{ matrix.webkit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 = GTK3 build most distros ship; 6.0 = GTK4 build, the one Avalonia's cookie manager binds to.
        webkit: [libwebkit2gtk-4.1-0, libwebkitgtk-6.0-4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebKitGTK and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.webkit }} xvfb xauth dbus-x11

      - name: Publish linux-x64 self-contained
        run: dotnet publish spikes/AvaloniaSpike -c Release -r linux-x64 --self-contained true -o out/spike

      - name: Run self-test
        run: dbus-run-session -- xvfb-run -a timeout 120 ./out/spike/AvaloniaSpike --selftest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-spike-linux-x64-${{ matrix.webkit }}
          path: out/spike
